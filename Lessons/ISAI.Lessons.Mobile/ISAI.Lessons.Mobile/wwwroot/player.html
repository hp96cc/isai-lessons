<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <link href="lib/videojs/video-js.css" rel="stylesheet" />
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: #000;
            -webkit-overflow-scrolling: touch;
            overflow: hidden;
        }

        /* Make the Video.js container and the actual video match the viewport */
        .video-js,
        #player,
        .video-js .vjs-tech {
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Preserve aspect ratio and ensure controls remain visible (contain prevents cropping) */
        #player {
            object-fit: contain;
            -o-object-fit: contain;
            background: #000;
        }

        /* ensure video.js control bar stays anchored */
        .vjs-control-bar {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
        }

        #debug {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            max-width: 90%;
            word-break: break-all;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div id="debug"></div>
    <video id="player" class="video-js vjs-fluid" controls playsinline webkit-playsinline></video>

    <script src="lib/videojs/video.min.js"></script>
    <script src="lib/hls/hls.min.js"></script>
    <script>
        (function ()
        {
            const debugDiv = document.getElementById('debug');
            function debug(msg)
            {
                console.log(msg);
                debugDiv.innerHTML += msg + '<br>';
            }

            debug('Player initializing...');

            const params = new URLSearchParams(location.search);
            const src = params.get('src') || '';
            const poster = params.get('poster') || '';
            const enSub = params.get('enSub') || '';
            const sslSub = params.get('sslSub') || '';

            debug('URL params parsed:');
            debug('src: ' + (src ? 'present' : 'missing'));
            debug('poster: ' + (poster ? 'present' : 'missing'));
            debug('enSub: ' + (enSub || 'missing'));
            debug('sslSub: ' + (sslSub || 'missing'));


            if (!src)
            {
                document.body.innerHTML = '<p style="color:white">No source</p>';
                return;
            }

            const video = document.getElementById('player');

            // Set poster if available
            if (poster)
            {
                video.poster = poster;
                debug('Poster set');
            }

            function initVideojs()
            {
                if (window.videojs)
                {
                    debug('Initializing Video.js...');
                    const player = videojs(video, {
                        controls: true,
                        preload: 'auto',
                        fluid: true,
                        playbackRates: [0.5, 0.75, 1, 1.25, 1.5, 2],
                        controlBar: {
                            fullscreenToggle: true,
                            pictureInPictureToggle: true
                        }
                    });

                    // Add subtitle tracks if available
                    let firstTrack = true;
                    if (enSub)
                    {
                        debug('Adding English subtitles: ' + enSub);
                        try
                        {
                            player.addRemoteTextTrack({
                                kind: 'subtitles',
                                label: 'English',
                                srclang: 'en',
                                src: enSub,
                                default: firstTrack // Make first track default
                            }, false);
                            debug('English subtitles added successfully');
                            firstTrack = false;
                        } catch (e)
                        {
                            debug('Error adding English subtitles: ' + e.message);
                        }
                    }

                    if (sslSub)
                    {
                        debug('Adding BSL subtitles: ' + sslSub);
                        try
                        {
                            player.addRemoteTextTrack({
                                kind: 'subtitles',
                                label: 'British Sign Language',
                                srclang: 'ssl',
                                src: sslSub,
                                default: firstTrack // Make default if it's the only track
                            }, false);
                            debug('BSL subtitles added successfully');
                        } catch (e)
                        {
                            debug('Error adding BSL subtitles: ' + e.message);
                        }
                    }

                    // Enable text tracks after adding them
                    player.ready(function ()
                    {
                        const textTracks = player.textTracks();
                        debug('Total text tracks: ' + textTracks.length);
                        for (let i = 0; i < textTracks.length; i++)
                        {
                            debug('Track ' + i + ': ' + textTracks[i].label + ' - mode: ' + textTracks[i].mode);
                        }
                    });

                    // Handle fullscreen events
                    player.on('fullscreenchange', function ()
                    {
                        if (player.isFullscreen())
                        {
                            debug('Entered fullscreen');
                        } else
                        {
                            debug('Exited fullscreen');
                        }
                    });

                    // Fallback: try native fullscreen if Video.js fullscreen fails
                    player.on('error', function (e)
                    {
                        debug('Player error: ' + (player.error() ? player.error().message : 'unknown'));
                    });

                    window.player = player;

                    // Hide debug info after 5 seconds if everything loaded
                    setTimeout(() =>
                    {
                        debugDiv.style.display = 'none';
                    }, 5000);
                }
            }

            // Native HLS (iOS)
            if (video.canPlayType && video.canPlayType('application/vnd.apple.mpegurl'))
            {
                debug('Using native HLS support');
                video.src = src;
                initVideojs();
            } else if (window.Hls && Hls.isSupported())
            {
                debug('Using HLS.js');
                const hls = new Hls();
                hls.loadSource(src);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function ()
                {
                    debug('HLS manifest parsed');
                    initVideojs();
                });
                hls.on(Hls.Events.ERROR, function (event, data)
                {
                    debug('HLS Error: ' + data.type + ' - ' + data.details);
                });
            } else
            {
                document.body.innerHTML = '<p style="color:white">HLS not supported</p>';
            }
        })();
    </script>
</body>
</html>
